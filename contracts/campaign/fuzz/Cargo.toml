[package]
name = "campaign-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Isolate this crate from the parent workspace so it does not participate in
# normal `cargo test` / `cargo build` runs.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
trivela-campaign-contract = { path = ".." }
soroban-sdk = { version = "25.1", features = ["testutils"] }
sha2 = "0.10"
ed25519-dalek = "2"

[[bin]]
name = "fuzz_register"
path = "fuzz_targets/fuzz_register.rs"
test = false
doc = false

[[bin]]
name = "fuzz_merkle_proof"
path = "fuzz_targets/fuzz_merkle_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_multisig"
path = "fuzz_targets/fuzz_multisig.rs"
test = false
doc = false
