name: Release — GitHub release with generated changelog

# Runs when a semver tag (vX.Y.Z) is pushed. Creates a GitHub release whose
# notes are generated from the merged pull requests since the previous tag.
# `--verify-tag` fails the job if the tag does not exist on the remote.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
