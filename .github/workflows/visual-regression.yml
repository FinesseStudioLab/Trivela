name: Visual Regression Tests

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/tests/visual/**'
      - 'frontend/package*.json'
  # Push trigger on main intentionally omitted (lightweight main-branch checks).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  visual-tests:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        id: visual
        working-directory: frontend
        run: npm run test:visual
        continue-on-error: true

      - name: Publish visual diff summary
        if: always()
        run: node scripts/visual-diff-summary.mjs frontend/test-results

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: frontend/playwright-report-visual/
          retention-days: 30

      - name: Upload diff images
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            frontend/test-results/**/*-diff.png
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-expected.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail if visual tests failed
        if: steps.visual.outcome == 'failure'
        run: exit 1
