name: SDK quickstart snippets

on:
  push:
    paths:
      - 'sdk/README.md'
      - 'sdk/core/**'
  pull_request:
    paths:
      - 'sdk/README.md'
      - 'sdk/core/**'

permissions:
  contents: read

jobs:
  quickstart:
    name: Quickstart snippet tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/core/package-lock.json

      - name: Install dependencies
        working-directory: sdk/core
        run: npm ci

      - name: Type-check
        working-directory: sdk/core
        run: npm run check

      - name: Run quickstart snippet tests
        working-directory: sdk/core
        run: node --experimental-strip-types --test test/quickstart.test.ts
