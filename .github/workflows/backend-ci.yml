name: Backend CI

on:
  # Push trigger on main intentionally omitted (lightweight main-branch checks).
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint --workspace=backend

      - name: Run backend typecheck (if available)
        run: |
          if npm --workspace=backend run | rg -q "  typecheck"; then
            npm run typecheck --workspace=backend
          else
            echo "No backend typecheck script found; skipping."
          fi

      - name: Test backend (unit tests via Turborepo)
        run: npx turbo run test --filter=backend

      - name: Test backend (integration tests)
        run: npm run test:integration --workspace=backend
        timeout-minutes: 1

      - name: Test backend (OpenAPI contract tests)
        run: npm run test:contract --workspace=backend
        timeout-minutes: 1

      - name: Test backend (API response snapshots)
        run: npm run test:snapshots --workspace=backend
        timeout-minutes: 1

      - name: Check for snapshot changes
        run: |
          if [ -n "$(git status --porcelain backend/src/tests/__snapshots__/)" ]; then
            echo "❌ Snapshot files have uncommitted changes!"
            echo "If these changes are intentional, run: npm run test:snapshots:update --workspace=backend"
            echo "Then commit the updated snapshots."
            echo ""
            git diff backend/src/tests/__snapshots__/
            exit 1
          else
            echo "✅ All snapshots match"
          fi

  # #1320: coverage gate. Runs the whole backend suite with Node's built-in coverage (needs Node 22
  # for the lcov reporter) and fails when line, branch or function coverage drops below the floors in
  # backend/coverage-thresholds.json. Test failures are reported by the steps above, not here.
  backend-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend coverage gate
        run: npm run test:coverage --workspace=backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore
